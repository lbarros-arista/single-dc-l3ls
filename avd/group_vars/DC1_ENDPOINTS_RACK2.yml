---
servers:
  - name: acb-r2-server1
    rack: ACB-RACK2
    adapters:
      - endpoint_ports: [ Ethernet1, Ethernet2 ]
        switch_ports: [ Ethernet1, Ethernet1 ]
        switches: [ acb-leaf2a, acb-leaf2b ] 
        profile: TRUNK_DC1
        port_channel:
          description: PortChannel1
          channel_id: 1
          mode: active

  - name: ACB-r2-server2
    rack: acb-RACK2
    adapters:
      - endpoint_ports: [ Ethernet1, Ethernet2 ]
        switch_ports: [ Ethernet2, Ethernet2 ]
        switches: [ acb-leaf2a, acb-leaf2b ] 
        profile: TRUNK_DC1
        port_channel:
          description: PortChannel2
          channel_id: 2
          mode: active