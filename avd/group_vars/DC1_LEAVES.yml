---

type: l3leaf

l3leaf:
  defaults:
    platform: ceos
    loopback_ipv4_pool: 10.1.255.0/24
    loopback_ipv4_offset: 2
    mlag_peer_ipv4_pool: 10.1.251.0/24
    mlag_peer_l3_ipv4_pool: 10.1.252.0/24
    uplink_ipv4_pool: 10.1.253.0/24
    vtep_loopback_ipv4_pool: 10.1.254.0/24
    virtual_router_mac_address: 00:1c:73:00:00:99
    uplink_switches: ['acb-spine1', 'acb-spine2']
    uplink_interface_speed: 100g-4
    uplink_interfaces: [ Ethernet55-56/1 ]
    mlag_interfaces: [ Ethernet53-54/1 ]
    mlag_interfaces_speed: 100g-4
    mlag_dual_primary_detection: true
    mlag_ibgp_origin_incomplete: true
    spanning_tree_mode: mstp
    spanning_tree_priority: 4096
    lacp_port_id_range:
      enabled: true
    bgp_defaults:
      - timers bgp 5 15
      - neighbor default send-community
    structured_config:
      ip_igmp_snooping:
        globally_enabled: true
        fast_leave: false
      mlag_configuration:
        reload_delay_mlag: 330
        reload_delay_non_mlag: 300
      router_l2_vpn:
        arp_learning_bridged: true
        nd_learning_bridged: true
      router_bgp:
        peer_groups:
          - name: EVPN-OVERLAY-PEERS
            peer_tag_in: SPINE-OL
            peer_tag_out_discard: SPINE-OL
          - name: IPv4-UNDERLAY-PEERS
            peer_tag_in: SPINE-UL
            peer_tag_out_discard: SPINE-UL
  node_groups:
    - group: acb-RACK1
      bgp_as: 65101
      nodes:
        - name: acb-leaf1a
          id: 1
          mgmt_ip: 172.16.1.13/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::13/64
          uplink_switch_interfaces: [ Ethernet1/1, Ethernet1/1 ]
        - name: acb-leaf1b
          id: 2
          mgmt_ip: 172.16.1.14/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::14/64
          uplink_switch_interfaces: [ Ethernet2/1, Ethernet2/1 ]
    - group: acb-RACK2
      bgp_as: 65102
      nodes:
        - name: acb-leaf2a
          id: 3
          mgmt_ip: 172.16.1.15/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::15/64
          uplink_switch_interfaces: [ Ethernet3/1, Ethernet3/1 ]
        - name: acb-leaf2b
          id: 4
          mgmt_ip: 172.16.1.16/24
          ipv6_mgmt_ip: 2001:db8:feed:beef::16/64
          uplink_switch_interfaces: [ Ethernet4/1, Ethernet4/1 ]
