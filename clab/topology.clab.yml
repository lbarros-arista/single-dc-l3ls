###############################################
################### HOSTS #####################
############################################### 
    server1a:
      kind: linux
      mgmt-ipv4: 172.16.1.90
      mgmt-ipv6: 2001:db8:feed:beef::90
      binds:
        - ../server/setup-namespaces.sh:/tmp/setup-namespaces.sh:ro
      exec:
        - bash /tmp/setup-namespaces.sh 1
      ports:
        - 4090:22/tcp
    server1b:
      kind: linux
      mgmt-ipv4: 172.16.1.91
      mgmt-ipv6: 2001:db8:feed:beef::91
