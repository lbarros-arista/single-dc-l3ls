---
name: AVD

prefix: ""

mgmt:
  network: MGMT
  ipv4-subnet: 172.16.1.0/24
  ipv6-subnet: 2001:db8:feed:beef::/64

topology:
  defaults:
    startup-delay: 5
  kinds:
    arista_ceos:
      image: arista/ceos:latest
    linux:
      image: lab-server:latest
  nodes:
###############################################
#################### DC1 ######################
###############################################
    acb-spine1:
      kind: arista_ceos
      mgmt-ipv4: 172.16.1.11
      mgmt-ipv6: 2001:db8:feed:beef::11
      startup-config: ../avd/intended/configs/acb-spine1.cfg
      binds:
        - ../clab/eos-intf-mapping/DCS-7050CX3-32S_EosIntfMapping.json:/mnt/flash/EosIntfMapping.json:ro
      ports:
        # - 5011:443/tcp
        - 4011:22/tcp
    acb-spine2:
      kind: arista_ceos
      mgmt-ipv4: 172.16.1.12
      mgmt-ipv6: 2001:db8:feed:beef::12
