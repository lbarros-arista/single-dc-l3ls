################## LINKS ######################
###############################################
  links:
# DC1
# Host Facing Links
    - endpoints: ["server1a:eth1", "acb-leaf1a:eth1"]
    - endpoints: ["server1a:eth2", "acb-leaf1b:eth1"]
    - endpoints: ["server1b:eth1", "acb-leaf1a:eth2"]
    - endpoints: ["server1b:eth2", "acb-leaf1b:eth2"]
    - endpoints: ["server2a:eth1", "acb-leaf2a:eth1"]
